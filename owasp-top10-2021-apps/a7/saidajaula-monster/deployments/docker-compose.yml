version: "3.4"
services:
  app:
    container_name: app-a7
    build:
      context: ../
      dockerfile: deployments/Dockerfile
    environment:
      A7_DATABASE_USER: user
      A7_DATABASE_PASSWORD: pass
      A7_DATABASE_HOST: db
      A7_DATABASE_NAME: A7
    links:
      - db:db
    depends_on:
      - db
    ports:
      - "10002:10002"
    networks:
      - a7_net
    volumes:
      - "../app/:/app"
    restart: always

  db:
    container_name: db-a7
    image: mariadb:10.6.3
    ports:
      - "3307:3307"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: A7
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    networks:
      - a7_net
    volumes:
      - storage-a7-database:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d

volumes:
  storage-a7-database:

networks:
  a7_net:

