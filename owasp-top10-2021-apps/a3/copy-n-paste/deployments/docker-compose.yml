version: '3.4'
services:
    api:
        container_name: a3_api
        build:
            context: ../
            dockerfile: deployments/a3inj.Dockerfile
        ports:
            - "10001:10001"
        networks:
            - a3net
        command: "go run server.go"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: user
            MYSQL_PASSWORD: pass
            MYSQL_DATABASE: a3db
        depends_on:
            - mysqldb
        external_links:
            - mysqldb:mysqldb
        restart: unless-stopped
        
    mysqldb:
        container_name: mysqldb
        image: mariadb:10.6.3
        ports:
          - "3307:3307"
        volumes:
            - db_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: user
            MYSQL_PASSWORD: pass
            MYSQL_DATABASE: a3db
        networks:
            - a3net

networks:
    a3net:

volumes:
    db_data: