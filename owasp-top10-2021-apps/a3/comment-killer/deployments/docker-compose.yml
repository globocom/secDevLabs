version: "3.7"

networks:
    a3_net:

services:
    app:
        container_name: app-a3
        build:
            context: ../
            dockerfile: deployments/app.Dockerfile
        ports:
            - "10007:3000"
        stdin_open: true
        networks:
            - a3_net

    api:
        container_name: api-a3
        build:
            context: ../
            dockerfile: deployments/api.Dockerfile
        ports:
            - "10017:10017"
        command: "go run main.go"
        networks:
            - a3_net
